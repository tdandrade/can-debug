<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAN Debug</title>
<style>
:root{--bg:#e9edf0;--sf:#fbfcfc;--ink:#1b2229;--mu:#5c6873;--ln:#c4ccd3;--ac:#1f5fbf;--al:#d9541e;--ok:#1c8a55}
@media(prefers-color-scheme:dark){:root{--bg:#14181c;--sf:#1c2227;--ink:#e4e9ed;--mu:#8d9aa6;--ln:#2e373f;--ac:#6aa5ff;--al:#ff8a5c;--ok:#4cc88a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:900px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-size:13px;font-weight:500;color:var(--mu)}.st.ok{color:var(--ok)}.st.wr{color:var(--al)}.st.er{color:#d22}
button,select,input{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 11px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.dg{border-color:var(--al);color:var(--al)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.info{font:12px ui-monospace,monospace;color:var(--mu);margin:4px 0 10px}
nav{display:flex;border-bottom:1px solid var(--ln);margin-bottom:10px;overflow-x:auto}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 14px}
nav button.on{border-bottom-color:var(--ac);font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:9px 11px}
.c small{color:var(--mu);display:block;font-size:12px}
.c b{font:600 26px/1.2 ui-monospace,monospace;font-variant-numeric:tabular-nums}.c i{font-style:normal;color:var(--mu);font-size:12px;margin-left:4px}
table{width:100%;border-collapse:collapse;font:13px ui-monospace,monospace}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500}
.h{background:var(--al);color:#fff;border-radius:3px;padding:0 2px}
pre{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px;height:260px;overflow:auto;font:12px ui-monospace,monospace;margin:6px 0;white-space:pre-wrap}
.dtc{display:flex;gap:12px;align-items:baseline;background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--al);border-radius:6px;padding:8px 11px;margin:6px 0}
.dtc b{font:600 18px ui-monospace,monospace}.mu{color:var(--mu)}
input{flex:1;min-width:90px}
.c{cursor:pointer}.c.off{opacity:.4}details{margin:2px 0}summary{cursor:pointer;padding:4px 0;font-weight:600}.pb{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 6px}.pb button{padding:4px 9px;font-size:13px}.pb span{display:inline-flex}.x{border:0;background:none;padding:0 5px;color:var(--mu)}
.box{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.5}.dtc button{margin-left:auto;padding:3px 9px;font-size:13px}
.warn{font-size:12px;color:var(--al);margin:6px 0}
</style></head><body><main>
<h1>CAN Debug <span class="st" id="st">Desconectado</span></h1>
<div class="row">
 <button class="pri" id="bU">USB serial</button>
 <select id="baud" title="Baud rate do adaptador USB"><option value="auto">Auto</option><option>38400</option><option>115200</option><option>9600</option><option>230400</option><option>500000</option></select>
 <button id="bB">Bluetooth LE</button><button id="bD">Demo</button><button id="bX" hidden>Desconectar</button>
</div>
<div class="info"><span id="ver">—</span> · <span id="proto">—</span> · <span id="vb">—</span> · <span id="mil"></span></div>
<nav><button data-t="p" class="on">Painel</button><button data-t="d">Falhas</button><button data-t="m">Monitor CAN</button><button data-t="t">Terminal</button></nav>

<section id="p">
 <div class="row"><button id="lv" disabled>Ler ao vivo</button><button id="csvL">Exportar CSV</button><label class="mu"><input type="checkbox" id="onlySup" checked style="flex:none;min-width:0"> só suportados</label></div>
 <div class="info" id="sl"></div>
 <div class="info" id="lf"></div>
 <div id="grid"></div>
</section>

<section id="d" hidden>
 <div class="row"><button data-m="03">Armazenadas</button><button data-m="07">Pendentes</button><button data-m="0A">Permanentes</button><button class="dg" id="clr">Limpar falhas</button></div>
 <div id="dl" class="mu">Escolha um tipo de leitura.</div>
 <div class="row"><input id="vh" placeholder="Veículo: marca, modelo, ano, motor (melhora a resposta da IA)"></div>
 <div class="row"><input id="dq" placeholder="Código (P0420)" maxlength="5" style="max-width:150px;flex:none"><button class="pri" id="ai">Pesquisar com IA</button><button id="aiw">Abrir no Claude.ai</button><button id="ak">Chave/modelo…</button>
  <label class="mu"><input type="checkbox" id="aw" style="flex:none;min-width:0"> buscar na web</label><label class="mu"><input type="checkbox" id="al" checked style="flex:none;min-width:0"> incluir leituras</label></div>
 <div id="aq" class="box" hidden></div>
</section>

<section id="m" hidden>
 <div class="row"><input id="flt" placeholder="Filtrar ID (ex.: 7E8) — vazio = todos" maxlength="8"><button class="pri" id="ms">Iniciar</button><button id="csvM">Exportar CSV</button></div>
 <div class="info"><span id="mc">0 frames</span> · <span id="mm">Bytes alterados nos últimos 1,5 s ficam destacados.</span></div>
 <table><thead><tr><th>ID</th><th>Qtd</th><th>ms</th><th>Dados</th></tr></thead><tbody id="mt"></tbody></table>
</section>

<section id="t" hidden>
 <div class="row"><input id="ci" placeholder="Comando — use ; para sequência (ATSH7E0;22F190)" autocapitalize="characters"><button class="pri" id="cs">Enviar</button><button id="cf">☆ Salvar</button><label class="mu"><input type="checkbox" id="tr" checked style="flex:none;min-width:0"> traduzir</label></div>
 <div id="pre"></div>
 <div class="row"><button id="tc">Limpar</button><button id="te">Exportar log</button></div>
 <pre id="term"></pre>
 <div class="row"><input id="fi" placeholder="ID (7E0)" maxlength="8" style="max-width:110px"><input id="fd" placeholder="Dados hex (02 01 0C)"><button class="dg" id="fs">Enviar frame</button></div>
 <div class="warn">Enviar frames/comandos de escrita pode alterar o comportamento do veículo. Use apenas com o carro parado e se souber o que faz.</div>
</section>
</main>
<script>
const $=s=>document.querySelector(s),h2=n=>n.toString(16).toUpperCase().padStart(2,'0'),hx=s=>s.replace(/\s/g,'').toUpperCase(),
bytes=h=>(h.match(/../g)||[]).map(x=>parseInt(x,16)),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n);
const pct=b=>b[0]*100/255,u16=b=>b[0]*256+b[1],raw=b=>b.map(h2).join(' '),sg=b=>(b[0]-128)*100/128;
const O2=['B1S1','B1S2','B1S3','B1S4','B2S1','B2S2','B2S3','B2S4'];
const BASE=[
[0x03,'Estado sist. combustível','',2,raw],[0x04,'Carga do motor','%',1,pct],[0x05,'Temp. líquido arref.','°C',1,b=>b[0]-40],
[0x06,'Trim curto comb. B1','%',1,sg],[0x07,'Trim longo comb. B1','%',1,sg],[0x08,'Trim curto comb. B2','%',1,sg],[0x09,'Trim longo comb. B2','%',1,sg],
[0x0A,'Pressão combustível','kPa',1,b=>b[0]*3],[0x0B,'Pressão MAP','kPa',1,b=>b[0]],[0x0C,'Rotação','rpm',2,b=>u16(b)/4],[0x0D,'Velocidade','km/h',1,b=>b[0]],
[0x0E,'Avanço ignição','°',1,b=>b[0]/2-64],[0x0F,'Temp. ar admissão','°C',1,b=>b[0]-40],[0x10,'Vazão MAF','g/s',2,b=>u16(b)/100],[0x11,'Posição borboleta','%',1,pct],
[0x13,'Sensores O2 presentes','',1,raw],...O2.map((s,i)=>[0x14+i,'O2 '+s+' tensão','V',1,b=>b[0]/200]),
[0x1C,'Padrão OBD','',1,raw],[0x1F,'Tempo desde partida','s',2,u16],[0x21,'Dist. com MIL acesa','km',2,u16],
[0x22,'Pressão rail (rel. coletor)','kPa',2,b=>u16(b)*0.079],[0x23,'Pressão rail (direta/diesel)','kPa',2,b=>u16(b)*10],
...O2.map((s,i)=>[0x24+i,'Lambda '+s,'λ',2,b=>u16(b)*2/65536]),
[0x2C,'EGR comandado','%',1,pct],[0x2D,'Erro EGR','%',1,sg],[0x2E,'Purga evap. comandada','%',1,pct],[0x2F,'Nível combustível','%',1,pct],
[0x30,'Aquecimentos desde limpeza','',1,b=>b[0]],[0x31,'Dist. desde limpeza','km',2,u16],[0x32,'Pressão vapor evap.','Pa',2,b=>((u16(b)<<16)>>16)/4],[0x33,'Pressão barométrica','kPa',1,b=>b[0]],
...['B1S1','B2S1','B1S2','B2S2'].map((s,i)=>[0x3C+i,'Temp. catalisador '+s,'°C',2,b=>u16(b)/10-40]),
[0x42,'Tensão do módulo','V',2,b=>u16(b)/1000],[0x43,'Carga absoluta','%',2,b=>u16(b)*100/255],[0x44,'Lambda comandado','λ',2,b=>u16(b)*2/65536],
[0x45,'Borboleta relativa','%',1,pct],[0x46,'Temp. ambiente','°C',1,b=>b[0]-40],[0x47,'Borboleta B (abs.)','%',1,pct],
[0x49,'Pedal acelerador D','%',1,pct],[0x4A,'Pedal acelerador E','%',1,pct],[0x4B,'Pedal acelerador F','%',1,pct],[0x4C,'Atuador borboleta cmd.','%',1,pct],
[0x4D,'Tempo com MIL acesa','min',2,u16],[0x4E,'Tempo desde limpeza','min',2,u16],[0x51,'Tipo de combustível','',1,raw],[0x52,'Etanol','%',1,pct],
[0x5A,'Pedal acelerador rel.','%',1,pct],[0x5B,'Vida bateria híbrida','%',1,pct],[0x5C,'Temp. óleo','°C',1,b=>b[0]-40],
[0x5D,'Avanço injeção','°',2,b=>u16(b)/128-210],[0x5E,'Consumo','L/h',2,b=>u16(b)/20],
[0x61,'Torque demandado','%',1,b=>b[0]-125],[0x62,'Torque real','%',1,b=>b[0]-125],[0x63,'Torque referência','Nm',2,u16],
[0xA6,'Odômetro','km',4,b=>(b[0]*16777216+(b[1]<<16)+(b[2]<<8)+b[3])/10]
].map(([id,n,u,l,f])=>({id,n,u,l,f}));
let PIDS=[...BASE];

let T=null,buf='',waiter=null,chain=Promise.resolve(),proto='',sup=null,live=false,mon=null,lastMon=null,lastErr='',samples=[];
const st=(t,c='')=>{$('#st').textContent=t;$('#st').className='st '+c};
const tl=[],ts=()=>{const d=new Date();return d.toLocaleTimeString('pt-BR',{hour12:false})+'.'+String(d.getMilliseconds()).padStart(3,'0')};
const tlog=t=>{const l=ts()+' '+t;if(tl.length<50000)tl.push(l);const e=$('#term');e.textContent+=l+'\n';if(e.textContent.length>40000)e.textContent=e.textContent.slice(-20000);e.scrollTop=e.scrollHeight};
const errOf=L=>L.find(l=>/UNABLE|NO DATA|CAN ERROR|BUS (BUSY|ERROR)|BUS INIT:.*ERROR|DATA ERROR|BUFFER FULL|FB ERROR|ERR\d\d|^\?$/i.test(l))||null;
const isCan=()=>/^[6-9A-C]$/.test(proto.length>1?proto.slice(1):proto);
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ---------- comunicação ---------- */
function onRx(s){
 buf+=s.replace(/\0/g,'');
 if(!mon&&!waiter&&s.trim())tlog('rx? '+JSON.stringify(s));
 if(mon){let i;while((i=buf.search(/[\r\n>]/))>=0){const ch=buf[i],ln=buf.slice(0,i).trim();buf=buf.slice(i+1);
   if(ch==='>'){mon.stop?mon.stop():T&&T.write('ATMA\r');continue}if(ln)monLine(ln)}return}
 const i=buf.indexOf('>');
 if(i>=0&&waiter){const r=buf.slice(0,i);buf=buf.slice(i+1);const w=waiter;waiter=null;w(r)}
}
/* ---------- tradução de comandos e respostas ---------- */
const ATD={Z:'Reiniciar adaptador',E0:'Desligar eco',E1:'Ligar eco',L0:'Sem quebras de linha extras',L1:'Com quebras de linha extras',S0:'Respostas sem espaços',S1:'Respostas com espaços',H0:'Ocultar cabeçalhos (IDs)',H1:'Mostrar cabeçalhos (IDs)',I:'Versão do adaptador',RV:'Tensão medida pelo adaptador',DP:'Protocolo em uso',DPN:'Nº do protocolo em uso',CS:'Contadores de erro CAN',CAF0:'Formatação CAN automática desligada',CAF1:'Formatação CAN automática ligada',MA:'Monitorar o barramento',WS:'Reinício rápido',D:'Restaurar padrões',AT0:'Timing adaptativo desligado',AT1:'Timing adaptativo normal',AT2:'Timing adaptativo agressivo',SP0:'Protocolo automático'};
const PRN={1:'SAE J1850 PWM',2:'SAE J1850 VPW',3:'ISO 9141-2',4:'ISO 14230-4 KWP (5 baud)',5:'ISO 14230-4 KWP (rápido)',6:'ISO 15765-4 CAN 11 bits/500k',7:'ISO 15765-4 CAN 29 bits/500k',8:'ISO 15765-4 CAN 11 bits/250k',9:'ISO 15765-4 CAN 29 bits/250k',A:'SAE J1939 CAN 29 bits/250k'};
const MODES={'03':'Ler falhas armazenadas','04':'Limpar falhas e dados de congelamento','07':'Ler falhas pendentes','0A':'Ler falhas permanentes','0600':'Modo 06: testes de monitoramento suportados','0900':'Modo 09: informações suportadas','0902':'Ler VIN (chassi)','0904':'Ler Cal. ID (calibração)','0906':'Ler CVN (verificação de calibração)','090A':'Ler nome da ECU'};
const DID={F190:'VIN',F187:'nº de peça',F18C:'nº de série',F191:'versão de hardware',F195:'versão de software'};
const NRC={10:'erro geral',11:'serviço não suportado',12:'subfunção não suportada',13:'formato inválido',22:'condições incorretas',31:'fora de alcance',33:'acesso negado (segurança)',35:'chave inválida',78:'resposta pendente'};
const ERRT=[[/NO DATA/i,'Sem dados (ECU não respondeu ou PID não suportado)'],[/UNABLE TO CONNECT/i,'Não foi possível conectar ao veículo (ignição/protocolo)'],[/BUFFER FULL/i,'Buffer do adaptador estourou (muitas respostas ou baud baixo)'],[/CAN ERROR/i,'Erro no barramento CAN'],[/BUS BUSY/i,'Barramento ocupado'],[/BUS INIT:.*ERROR/i,'Falha ao inicializar o barramento'],[/BUS INIT:.*OK/i,'Barramento inicializado'],[/DATA ERROR/i,'Resposta com erro de dados'],[/FB ERROR/i,'Erro de feedback (fio/barramento)'],[/SEARCHING/i,'Procurando protocolo…'],[/STOPPED/i,'Interrompido'],[/^\?$/,'Comando não reconhecido'],[/^OK$/,'OK']];
const HARD=/UNABLE|BUFFER FULL|CAN ERROR|DATA ERROR|BUS (BUSY|ERROR)|FB ERROR|BUS INIT:.*ERROR/i;
const trErr=l=>{const e=ERRT.find(([r])=>r.test(l));return e?e[1]:null};
const after=(L,w)=>{for(const l of L){const h=hx(l),i=h.indexOf(w);if(i>=0&&/^[0-9A-F]+$/.test(h))return bytes(h.slice(i+w.length))}return null};
const txt=b=>b.filter(v=>v>=32&&v<127).map(v=>String.fromCharCode(v)).join('');
const pidOf=n=>PIDS.concat(BASE).find(q=>q.id===n);
function asciiFrom(L,w){
 const ml=L.filter(l=>/^[0-9A-F]:/i.test(l)),ch=ml.length?[ml.map(l=>l.replace(/^[0-9A-F]:/i,'')).join(' ')]:L.filter(l=>/^[0-9A-F\s]+$/i.test(l)&&!/^[0-9A-F]{3}$/i.test(l));
 return ch.map(c=>{const b=bytes(hx(c)),i=b.findIndex((v,k)=>v===parseInt(w.slice(0,2),16)&&b[k+1]===parseInt(w.slice(2),16));return i<0?'':txt(b.slice(i+3))}).filter(Boolean).join(isCan()?' / ':'');
}
function trCmd(c){
 const x=c.replace(/\s/g,'').toUpperCase();let m;
 if(x.startsWith('AT')){const a=x.slice(2);
  if(ATD[a])return ATD[a];
  if(m=a.match(/^SP([0-9A])$/))return 'Definir protocolo '+m[1]+' ('+PRN[m[1]]+')';
  if(m=a.match(/^SH([0-9A-F]+)$/))return 'Definir ID de requisição '+m[1];
  if(a==='CRA')return 'Remover filtro de ID';
  if(m=a.match(/^CRA([0-9A-F]+)$/))return 'Receber somente do ID '+m[1];
  if(m=a.match(/^ST([0-9A-F]+)$/))return 'Timeout de resposta '+parseInt(m[1],16)*4+' ms';
  return null}
 if(!/^[0-9A-F]+$/.test(x)||x.length%2)return null;
 if(MODES[x])return MODES[x];
 const sid=x.slice(0,2);
 if(sid==='01'&&x.length===4){const n=parseInt(x.slice(2),16);if(n===1)return 'Status do monitor / MIL';if(n%32===0)return 'PIDs suportados ('+h2(n+1)+'–'+h2(n+32)+')';const p=pidOf(n);return 'Modo 01: '+(p?p.n:'PID '+h2(n))}
 if(sid==='02'&&x.length===6){const p=pidOf(parseInt(x.slice(2,4),16));return 'Quadro congelado: '+(p?p.n:'PID '+x.slice(2,4))}
 if(sid==='22'&&x.length===6)return 'UDS: ler dado '+x.slice(2)+(DID[x.slice(2)]?' ('+DID[x.slice(2)]+')':'');
 if(sid==='19'&&x.length===6)return 'UDS: ler falhas (máscara '+x.slice(4)+')';
 if(x==='3E00')return 'UDS: tester present';
 if(sid==='10')return 'UDS: iniciar sessão '+x.slice(2);
 return null;
}
function decode(x,L){
 if(x==='ATRV')return L[0]?'Tensão: '+L[0]:null;
 if(x==='ATDPN'&&L[0]){const a=L[0].length>1&&L[0][0]==='A',n=a?L[0].slice(1):L[0];return(a?'Automático: ':'')+(PRN[n]||n)}
 if(!/^[0-9A-F]+$/.test(x)||x.length%2||L.some(l=>HARD.test(l)))return null;
 const sid=x.slice(0,2),pos=h2(parseInt(sid,16)+0x40);let b;
 for(const l of L){const h=hx(l);if(h.startsWith('7F'+sid)&&h.length>=6&&/^[0-9A-F]+$/.test(h))return 'Resposta negativa: '+(NRC[h.slice(4,6)]||'código '+h.slice(4,6))}
 if(sid==='01'&&x.length===4){
  const n=parseInt(x.slice(2),16);b=after(L,pos+x.slice(2));if(!b)return null;
  if(n%32===0&&b.length>=4){const m=((b[0]<<24)|(b[1]<<16)|(b[2]<<8)|b[3])>>>0,r=[];for(let i=1;i<=31;i++)if(m&(1<<(32-i)))r.push(h2(n+i));return r.length+' PIDs suportados: '+r.join(' ')+(m&1?' (+ próxima faixa)':'')}
  if(n===1)return(b[0]&128?'MIL acesa':'MIL apagada')+', '+(b[0]&127)+' falha(s)';
  const p=pidOf(n);if(!p)return 'Valor bruto: '+raw(b);if(b.length<p.l)return null;
  const v=p.f(b);return p.n+': '+(typeof v==='number'?(Math.abs(v)>=100?v.toFixed(0):v.toFixed(1)):v)+(p.u?' '+p.u:'');
 }
 if(x==='03'||x==='07'||x==='0A'){const d=dtcFrom(L,x);return d.length?d.length+' falha(s): '+d.join(', '):'Nenhuma falha'}
 if(x==='04')return L.some(l=>hx(l).includes('44'))?'ECU confirmou a limpeza':null;
 if(sid==='09'&&x.length===4){
  if(L.filter(l=>/^0:/.test(l)).length>1)return 'Várias ECUs responderam ao mesmo tempo (use ATSH7E0 ou ATH1 para separar)';
  const nm={'02':'VIN','04':'Cal. ID','0A':'Nome da ECU'}[x.slice(2)];if(!nm)return null;
  const t=asciiFrom(L,'49'+x.slice(2));return t?nm+': '+t:null}
 if(sid==='22'&&x.length===6){b=after(L,'62'+x.slice(2));if(!b)return null;return(DID[x.slice(2)]||'Dado '+x.slice(2))+': '+((/^F1[89]/.test(x.slice(2))&&txt(b))||raw(b))}
 if(sid==='19'&&x.slice(2,4)==='02'){b=after(L,'5902');if(!b)return null;b=b.slice(1);const o=[];
  for(let i=0;i+3<b.length;i+=4)o.push('PCBU'[b[i]>>6]+((b[i]>>4)&3)+(b[i]&15).toString(16).toUpperCase()+h2(b[i+1])+'-'+h2(b[i+2])+' (status '+h2(b[i+3])+')');
  return o.length?o.length+' falha(s): '+o.join(', '):'Nenhuma falha'}
 if(x==='3E00')return L.some(l=>hx(l).includes('7E00'))?'ECU respondeu (tester present)':null;
 if(sid==='10')return L.some(l=>hx(l).includes('50'+x.slice(2,4)))?'Sessão iniciada':null;
 return null;
}
function trRsp(c,L){
 const x=c.replace(/\s/g,'').toUpperCase();let d=null;
 try{d=decode(x,L)}catch{}
 if(d)return d;
 const e=L.map(trErr).filter(t=>t&&t!=='OK');return e.length?e.join('; '):null;
}
const fmtTx=(c,raw)=>{try{const t=!raw&&$('#tr').checked?trCmd(c):null;return t?t+' ('+c+')':c}catch{return c}};

  await p.open({baudRate:b});
  const w=p.writable.getWriter(),rd=p.readable.getReader(),dec=new TextDecoder(),enc=new TextEncoder();
  const me={write:s=>w.write(enc.encode(s)),close:async()=>{try{await rd.cancel()}catch{}try{rd.releaseLock()}catch{}try{await w.close()}catch{}try{w.releaseLock()}catch{}try{await p.close()}catch{}}};
  T=me;
  (async()=>{try{for(;;){const{value,done}=await rd.read();if(done)break;onRx(dec.decode(value,{stream:true}))}}catch{}if(T===me){st('Conexão perdida','er');disc()}})();
  try{await cmd('ATI',2000);ok=true;break}catch{}

  const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'HTTP '+r.status);
  box.innerHTML='<b>'+esc(code)+'</b><br>'+md(j.content.filter(x=>x.type==='text').map(x=>x.text).join(''))+'<br><span class="mu">Resposta gerada por IA. Confirme no manual de serviço do veículo.</span>';
 }catch(e){box.textContent='Erro na consulta: '+e.message+'. Verifique a chave e o modelo, ou use “Abrir no Claude.ai”.'}
}
